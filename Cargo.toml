[package]
name = "cal-based"
version = "0.1.3"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
repository = "https://github.com/xpjb/cal-based"

[dependencies]
based = { git = "ssh://git@github.com/xpjb/based.git", rev = "31b7914cb020f9f15be87d24dcf83c26a545a28c", features = ["wgpu", "sanscale"] }
bytemuck = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
ropey = { version = "1", default-features = false, features = ["simd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4", "js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = { version = "3", default-features = false }
directories = "6"

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = "0.3"

[dev-dependencies]
tempfile = "3"
