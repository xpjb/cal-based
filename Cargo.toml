[package]
name = "cal-based"
version = "0.1.3"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
repository = "https://github.com/xpjb/cal-based"

[dependencies]
arboard = { version = "3", default-features = false }
based = { git = "ssh://git@github.com/xpjb/based.git", rev = "4b94372762c01aa935cb8e7d2a6977c4fcd68313", features = ["wgpu", "sanscale"] }
bytemuck = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
directories = "6"
pollster = "0.4"
ropey = { version = "1", default-features = false, features = ["simd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"
